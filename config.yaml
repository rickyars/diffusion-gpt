# Discrete Diffusion GPT Training Configuration

# Device configuration
device: auto  # 'auto', 'cuda', 'cpu' - auto will use CUDA if available

# Random seed for reproducibility
seed: 42

# Training hyperparameters
training:
  epochs: 51  # 25-50 epochs is usually sufficient (100 is overkill)
  batch_size: 352  # increase to 128 or 256 if GPU memory allows
  learning_rate: 0.0001
  val_split: 0.1  # fraction of data for validation
  eval_interval: 5  # evaluate every N epochs
  save_interval: 5  # save checkpoint every N epochs
  log_interval: 100  # log loss every N batches (was 10, reduced I/O overhead)
  use_compile: true  # torch.compile() for faster training (requires Triton, may not work on Windows)
  use_fused_adamw: true  # Enable fused AdamW optimizer (5-8% speedup on NVIDIA GPUs, requires CUDA)
  use_amp: true  # Enable mixed precision training (AMP) for faster computation (requires CUDA, slightly less stable than FP32)
  loss_weight_mode: 'snr'  # options: 'uniform' (baseline), 'snr' (emphasize sharpness), 'importance' (faster convergence)
  skip_completed: true  # skip datasets that have completed training (final .pt file exists)

# Model architecture
model:
  n_layer: 6  # number of transformer layers
  n_head: 6  # number of attention heads
  n_embd: 384  # embedding dimension
  cond_dim: 64  # conditioning dimension for noise
  dropout: 0.2  # dropout probability
  bias: false  # use bias in linear layers
  context_length: 256  # maximum sequence length

# Noise schedule
noise:
  sigma_min: 0.0001
  sigma_max: 20.0

# Sampling/Generation parameters
sampling:
  steps: 128  # number of denoising steps
  temperature: 1.0  # sampling temperature
  num_samples: 10  # number of samples to generate

# Datasets configuration
# Add your datasets here following the template below
# Each dataset should be a .txt file with one document per line

datasets:
  # Example 1: Shakespeare (for testing)
  shakespeare:
    path: datasets/shakespeare.txt
    enabled: true
    description: "Shakespeare's complete works"
    # max_chars: 1000000  # Optional: limit to first 1M characters

  # 1M Reddit confessions, as sample
  confessions-sample:
    path: datasets/reddit-confessions-sample.txt
    enabled: true
    description: "1M Reddit confessions"

  # r/confession
  confession:
    path: datasets/r-confessions.txt
    enabled: true
    description: "r/confession"

# Output directories
paths:
  datasets_dir: datasets
  models_dir: models
  outputs_dir: outputs
  vocab_dir: vocab  # store vocabulary files here
