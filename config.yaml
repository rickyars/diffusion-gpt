# =============================================================================
# Discrete Diffusion GPT Configuration
# =============================================================================

# =============================================================================
# System Configuration
# =============================================================================
device: auto  # 'auto' (use CUDA if available), 'cuda', or 'cpu'
seed: 42      # Random seed for reproducibility

# Output directories
paths:
  datasets_dir: datasets
  models_dir: models
  outputs_dir: outputs
  vocab_dir: vocab


# =============================================================================
# Model Architecture
# =============================================================================
model:
  # Transformer architecture
  n_layer: 6           # Number of transformer layers
  n_head: 6            # Number of attention heads
  n_embd: 384          # Embedding dimension
  context_length: 256  # Maximum sequence length
  dropout: 0.2         # Dropout probability during training
  bias: false          # Use bias in linear layers (false = slightly faster)

  # Conditioning for diffusion
  cond_dim: 64         # Conditioning dimension for noise level

  # Noise schedule (diffusion process)
  sigma_min: 0.0001    # Minimum noise level
  sigma_max: 20.0      # Maximum noise level


# =============================================================================
# Training Configuration
# =============================================================================
training:
  # Basic training parameters
  epochs: 50                  # Number of training epochs (25-50 usually sufficient)
  batch_size: 352             # Batch size (reduce if OOM, increase if memory allows)
  learning_rate: 0.0001       # Initial learning rate

  # Learning rate schedule
  warmup_steps: 1000          # Steps for linear LR warmup (0 to disable)
  min_lr_ratio: 0.1           # Min LR as fraction of initial LR (cosine annealing)

  # Validation and logging
  val_split: 0.1              # Fraction of data for validation
  eval_interval: 100          # Evaluate validation loss every N epochs
  save_interval: 5            # Save checkpoint every N epochs
  log_interval: 1000          # Log training loss every N batches
  skip_completed: true        # Skip datasets with existing final checkpoint

  # Performance optimizations
  use_compile: true           # torch.compile() for faster training (CUDA only, requires Triton)
  use_fused_adamw: true       # Fused AdamW optimizer (5-8% speedup on CUDA)
  use_amp: true               # Automatic Mixed Precision (faster, uses less memory on CUDA)


# =============================================================================
# Generation Configuration (defaults for generate.py)
# =============================================================================
generation:
  steps: 128           # Number of denoising steps (more = better quality, slower)
  temperature: 1.0     # Sampling temperature (higher = more random)
  num_samples: 10      # Number of samples to generate


# =============================================================================
# Datasets
# =============================================================================
# Add your datasets here. Each dataset should be a .txt file with one
# document/paragraph per line in UTF-8 encoding.

datasets:
  # Example: Shakespeare (good for testing)
  shakespeare:
    path: datasets/shakespeare.txt
    enabled: true
    description: "Shakespeare's complete works"
    # max_chars: 1000000  # Optional: limit to first N characters for testing

  # Reddit confessions sample
  confessions-sample:
    path: datasets/reddit-confessions-sample.txt
    enabled: true
    description: "1M Reddit confessions (sample)"

  # Full r/confession dataset
  confession:
    path: datasets/r-confessions.txt
    enabled: true
    description: "r/confession posts"
