<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
      color: #33ff33;
      cursor: default;
    }

    #textCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 1;
    }

    #glCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 10;
    }

    #overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5vmin;
      opacity: 0.6;
      pointer-events: none;
      text-align: center;
      padding: 2vmin;
      z-index: 100;
      transition: opacity 2s;
    }

    #overlay.hidden {
      opacity: 0;
    }

    body.ready #overlay {
      opacity: 0;
    }
  </style>
</head>
<body>
  <canvas id="textCanvas"></canvas>
  <canvas id="glCanvas"></canvas>
  <div id="overlay">LOADING...</div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/ort.min.js"></script>
  <script id="model-raw-data" type="text/plain">{{MODEL_BASE64}}</script>
  <script>
'use strict';

// ============================================================================
// EMBEDDED DATA
// ============================================================================

const MODEL_CONFIG = {{MODEL_CONFIG}};
const VOCAB = {{VOCAB}};

function base64ToUint8Array(base64) {
  const binaryString = atob(base64);
  const bytes = new Uint8Array(binaryString.length);
  for (let i = 0; i < binaryString.length; i++) {
    bytes[i] = binaryString.charCodeAt(i);
  }
  return bytes;
}

// ============================================================================
// INFERENCE ENGINE
// ============================================================================

{{INFERENCE_ENGINE}}

// ============================================================================
// MAIN APPLICATION
// ============================================================================

const States = {
  VOID: 'VOID',
  WE_FADEIN: 'WE_FADEIN',
  WE_HOLD: 'WE_HOLD',
  WE_DISSOLVE: 'WE_DISSOLVE',
  CONF_GENERATING: 'CONF_GENERATING',
  CONF_HOLD: 'CONF_HOLD',
  CONF_FADE: 'CONF_FADE'
};

// Diffusion configuration
const DIFFUSION_CONFIG = {
  TOTAL_STEPS: 64,       // Total denoising steps
};

const TIMING = {
  VOID: 1000,  // Short initial pause
  WE_FADEIN: 1500,
  WE_HOLD: 2500,
  WE_DISSOLVE: 2500,  // 2.5 seconds for extended glitching
  CONF_HOLD: 8000,    // 8 seconds for reading
  CONF_FADE: 4000     // 4 seconds slow fade
};

// Text grid constants
const TEXT_GRID = {
  CHARS_PER_LINE: 32,
  LINE_COUNT: 8,
  TOTAL_CHARS: 256,
  CHAR_WIDTH_RATIO: 0.6,  // Monospace fonts are ~60% as wide as tall
  CENTER_OFFSET: 15.5,    // (CHARS_PER_LINE / 2) - 0.5 for centering
};

// Effect configuration with per-state overrides
const EFFECT_CONFIG = {
  default: {
    glitchIntensity: 0.003,    // Base jitter amount (multiplied by canvas width/height)
    rgbSplitChance: 0.05,      // 5% chance per frame
    rgbSplitOffset: 2,         // Pixels of RGB channel separation
    shadowBlur: 0.25,          // Shadow blur as fraction of font size
    shadowColor: '#33ff33',    // Phosphor green
    textColorRGB: '51, 255, 51',  // RGB values for text (opacity applied separately)
    flickerEnabled: true,      // Screen brightness flicker
    flickerIntensity: 0.5,     // How strong the flicker is (0-1)
    flickerSpeed: 8.0,         // Base flicker frequency
  },
  WE_HOLD: {
    glitchIntensity: 0.005,    // More jitter when holding
  },
  WE_DISSOLVE: {
    glitchIntensity: 0.005,    // Same jitter as hold
    rgbSplitChance: 0.08,      // More RGB splits during dissolve
  },
  CONF_GENERATING: {
    glitchIntensity: 0.001,
  },
  CONF_HOLD: {
    glitchIntensity: 0.001,
  },
  CONF_FADE: {
    glitchIntensity: 0.001,
  },
};

class WEApp {
  constructor() {
    this.textCanvas = document.getElementById('textCanvas');
    this.glCanvas = document.getElementById('glCanvas');
    this.textCtx = this.textCanvas.getContext('2d');

    // WebGL 2.0 only (required for CRT effects)
    this.gl = this.glCanvas.getContext('webgl2', { alpha: false, antialias: false });

    this.state = States.VOID;
    this.stateTime = 0;
    this.lastTime = 0;

    this.inferenceEngine = null;
    this.confessionGenerator = null;
    this.activeText = "";
    this.previousText = ""; // For the highlight effect
    this.isGenerating = false;

    this.modelLoaded = false;
    this.webglReady = false;
  }

  async init() {
    this.resize();
    window.addEventListener('resize', () => this.resize());

    // Load model first
    await this.loadModel();

    // Hide overlay immediately - auto-start
    document.getElementById('overlay').classList.add('hidden');
    document.body.classList.add('ready');

    // Start animation loop immediately
    requestAnimationFrame((t) => this.loop(t));
  }

  async loadModel() {
    try {
      const dataElement = document.getElementById('model-raw-data');
      let rawBase64 = dataElement.textContent.trim();

      dataElement.remove();

      const modelBytes = base64ToUint8Array(modelData);
      rawBase64 = null;
      
      this.inferenceEngine = new DiffusionInferenceEngine(
        modelBytes,
        VOCAB,
        MODEL_CONFIG
      );

      await this.inferenceEngine.init();
      this.modelLoaded = true;
    } catch (error) {
      console.error(error);
      document.getElementById('overlay').textContent = 'ERROR: ' + error.message;
    }
  }

  resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    // Cap DPR at 2.0 to prevent memory explosion on 3x/4x Retina displays
    // This keeps it sharp while avoiding the 9x-16x pixel count on high-end phones
    const dpr = Math.min(window.devicePixelRatio || 1, 2.0);

    this.textCanvas.width = w * dpr;
    this.textCanvas.height = h * dpr;
    this.textCanvas.style.width = w + 'px';
    this.textCanvas.style.height = h + 'px';
    // Reset transform and apply dpr scaling (setting canvas.width resets transform)
    this.textCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    this.glCanvas.width = w * dpr;
    this.glCanvas.height = h * dpr;
    this.glCanvas.style.width = w + 'px';
    this.glCanvas.style.height = h + 'px';

    if (this.gl) {
      this.gl.viewport(0, 0, this.glCanvas.width, this.glCanvas.height);
    }

    // Store logical dimensions for render methods
    this.logicalWidth = w;
    this.logicalHeight = h;
  }

  // -------------------------------------------------------------------------
  // Effect Helpers
  // -------------------------------------------------------------------------

  getEffectConfig(state = this.state) {
    return { ...EFFECT_CONFIG.default, ...EFFECT_CONFIG[state] };
  }

  calcGlitchOffset(config, w, h) {
    const intensity = config.glitchIntensity;
    return {
      x: (Math.random() - 0.5) * intensity * w,
      y: (Math.random() - 0.5) * intensity * h
    };
  }

  applyFlicker(config, time) {
    if (!config.flickerEnabled || config.flickerIntensity <= 0) {
      return 1.0;
    }

    const speed = config.flickerSpeed;
    const intensity = config.flickerIntensity;

    // Multi-frequency flicker for organic CRT feel
    let flicker = Math.sin(time * speed) * 0.4 +
                  Math.sin(time * speed * 1.7) * 0.3 +
                  Math.sin(time * speed * 3.1) * 0.2 +
                  Math.sin(time * speed * 7.3) * 0.1;

    // Normalize to 0-1 range then scale by intensity
    flicker = (flicker + 1.0) * 0.5;  // Now 0-1
    flicker = 1.0 - (intensity * (1.0 - flicker));  // Apply intensity

    // Occasional random brightness dips (like old CRT power fluctuations)
    if (Math.random() < 0.01) {
      flicker *= 0.85 + Math.random() * 0.1;
    }

    return flicker;
  }

  shouldApplyRGBSplit(config) {
    return Math.random() < config.rgbSplitChance;
  }

  getTextColor(config, opacity) {
    return `rgba(${config.textColorRGB}, ${opacity})`;
  }

  renderWithRGBSplit(config, glitchOffset, drawFn) {
    const offset = config.rgbSplitOffset;

    // Red channel offset
    this.textCtx.fillStyle = `rgba(255, 0, 0, 0.3)`;
    drawFn(glitchOffset.x - offset, glitchOffset.y);

    // Blue channel offset
    this.textCtx.fillStyle = `rgba(0, 0, 255, 0.3)`;
    drawFn(glitchOffset.x + offset, glitchOffset.y);
  }

  loop(time) {
    const deltaTime = time - this.lastTime;
    this.lastTime = time;

    if (!this.modelLoaded) {
      requestAnimationFrame((t) => this.loop(t));
      return;
    }

    this.updateState(deltaTime);
    this.render(time);

    requestAnimationFrame((t) => this.loop(t));
  }

  updateState(deltaTime) {
    this.stateTime += deltaTime;

    switch (this.state) {
      case States.VOID:
        if (this.stateTime > TIMING.VOID) {
          this.transitionTo(States.WE_FADEIN);
        }
        break;

      case States.WE_FADEIN:
        if (this.stateTime > TIMING.WE_FADEIN) {
          this.transitionTo(States.WE_HOLD);
        }
        break;

      case States.WE_HOLD:
        if (this.stateTime > TIMING.WE_HOLD) {
          this.transitionTo(States.WE_DISSOLVE);
        }
        break;

      case States.WE_DISSOLVE:
        if (this.stateTime > TIMING.WE_DISSOLVE) {
          this.transitionTo(States.CONF_GENERATING);
        }
        break;

      case States.CONF_GENERATING:
        if (!this.isGenerating) {
          this.isGenerating = true;
          this.startGeneration();
        }
        break;

      case States.CONF_HOLD:
        this.isGenerating = false;

        if (this.stateTime > TIMING.CONF_HOLD) {
          this.transitionTo(States.CONF_FADE);
        }
        break;

      case States.CONF_FADE:
        if (this.stateTime > TIMING.CONF_FADE) {
          // Fade complete - start next generation cycle
          this.transitionTo(States.CONF_GENERATING);
        }
        break;
    }
  }

  transitionTo(newState) {
    this.state = newState;
    this.stateTime = 0;

    if (newState === States.WE_FADEIN) {
      this.activeText = "";
      this.previousText = "";
      this.frameCounter = 0;
    }
  }

  async startGeneration() {
      this.frameCounter = 0;

      try {
          const stream = this.inferenceEngine.generateStream(
              TEXT_GRID.TOTAL_CHARS,
              DIFFUSION_CONFIG.TOTAL_STEPS
          );

          // The 'for await' loop handles the generator AND the timing
          for await (const step of stream) {
              this.previousText = this.activeText;
              this.activeText = step.text;
              this.frameCounter++;
          }

          this.transitionTo(States.CONF_HOLD);
      } catch (e) {
          console.error('Generation failed:', e);
          this.isGenerating = false;
          this.transitionTo(States.CONF_HOLD);
      }
  }

  render(time) {
    const w = this.logicalWidth || window.innerWidth;
    const h = this.logicalHeight || window.innerHeight;

    // Clear canvas completely
    this.textCtx.fillStyle = '#000';
    this.textCtx.fillRect(0, 0, w, h);

    // Render text based on state
    switch (this.state) {
      // "WE" Sequence (The Intro)
      case States.WE_FADEIN:
        this.renderWE(this.stateTime / TIMING.WE_FADEIN, time);
        break;
      case States.WE_HOLD:
        this.renderWE(1.0, time);
        break;
      case States.WE_DISSOLVE:
        this.renderWEDissolve(this.stateTime / TIMING.WE_DISSOLVE, time);
        break;

      // Confession Sequence (Unified logic)
      case States.CONF_GENERATING:
      case States.CONF_HOLD:
      case States.CONF_FADE:
        if (this.activeText) {
          // Calculate opacity based on whether we are fading out or not
          let opacity = 1.0;
          if (this.state === States.CONF_FADE) {
            opacity = Math.max(0, 1.0 - (this.stateTime / TIMING.CONF_FADE));
          } else if (this.state === States.CONF_GENERATING) {
            // Subtle pulse during generation to show activity
            opacity = 0.9 + Math.sin(time * 0.01) * 0.1;
          }

          // renderConfession handles the text, the highlight, and the progress bar
          this.renderConfession(
            this.activeText, 
            opacity, 
            time, 
            this.previousText, 
            this.state === States.CONF_GENERATING // showProgress is true only when generating
          );
        }
        break;
    }

    // Copy to WebGL (simple passthrough for now)
    this.renderWebGL();
  }

  renderWE(opacity, time) {
    const w = this.logicalWidth || window.innerWidth;
    const h = this.logicalHeight || window.innerHeight;
    const config = this.getEffectConfig();

    // Apply flicker effect
    const flickerMult = this.applyFlicker(config, time / 1000);

    // Pulse effect for brightness variation
    const pulse = Math.sin(time * 0.0015) * 0.15;
    const brightness = (1.0 + pulse) * flickerMult;

    // Calculate glitch offset using config
    const glitchOffset = this.calcGlitchOffset(config, w, h);

    this.textCtx.save();
    this.textCtx.textAlign = 'center';
    this.textCtx.textBaseline = 'middle';

    const fontSize = h * 0.2;  // Large, prominent text
    this.textCtx.font = `900 ${fontSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif`;

    this.textCtx.shadowColor = config.shadowColor;
    this.textCtx.shadowBlur = fontSize * 0.3;

    const alpha = Math.min(1.0, opacity * brightness);

    // Draw function for reuse with RGB split
    const drawWE = (offsetX, offsetY) => {
      this.textCtx.fillText('WE', w / 2 + offsetX, h / 2 + offsetY);
    };

    // Occasional RGB channel split glitch
    if (this.shouldApplyRGBSplit(config)) {
      this.renderWithRGBSplit(config, glitchOffset, drawWE);
    }

    // Draw main green channel
    this.textCtx.fillStyle = this.getTextColor(config, alpha);
    drawWE(glitchOffset.x, glitchOffset.y);

    this.textCtx.restore();
  }

  renderWEDissolve(progress, time) {
    const w = this.logicalWidth || window.innerWidth;
    const h = this.logicalHeight || window.innerHeight;
    const config = this.getEffectConfig();

    // Apply flicker effect
    const flickerMult = this.applyFlicker(config, time / 1000);

    const opacity = (1.0 - progress) * flickerMult;

    // Calculate glitch offset using config
    const glitchOffset = this.calcGlitchOffset(config, w, h);

    this.textCtx.save();
    this.textCtx.textAlign = 'center';
    this.textCtx.textBaseline = 'middle';

    const fontSize = h * 0.2;  // Match larger WE size
    this.textCtx.font = `900 ${fontSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif`;

    this.textCtx.shadowColor = config.shadowColor;
    this.textCtx.shadowBlur = fontSize * 0.3;

    // Determine text (with character glitching during dissolve)
    let text = 'WE';
    // Much more aggressive glitching throughout the dissolve
    // Starts at 30% progress, increases frequency as we approach the end
    const glitchThreshold = 1.0 - (progress * 2.0);  // More glitching as progress increases
    if (progress > 0.3 && Math.random() > glitchThreshold) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
      text = chars[Math.floor(Math.random() * chars.length)] +
             chars[Math.floor(Math.random() * chars.length)];
    }

    // Draw function for reuse with RGB split
    const drawText = (offsetX, offsetY) => {
      this.textCtx.fillText(text, w / 2 + offsetX, h / 2 + offsetY);
    };

    // Occasional RGB channel split glitch
    if (this.shouldApplyRGBSplit(config)) {
      this.renderWithRGBSplit(config, glitchOffset, drawText);
    }

    // Draw main green channel
    this.textCtx.fillStyle = this.getTextColor(config, opacity);
    drawText(glitchOffset.x, glitchOffset.y);

    this.textCtx.restore();
  }

  renderConfession(text, opacity, time, prevText = null, showProgress = false) {
    // SAFETY 1: If the AI is lagging and 'text' is empty/null, 
    // bail out immediately to keep the screen black instead of flashing white.
    if (!text || text.length === 0) return;
    
    // SAFETY 2: Use a local copy of the text 
    // This prevents the AI from changing the string mid-draw (which causes flickering)
    const renderTarget = String(text);
    const stablePrev = prevText ? String(prevText) : null;

    const w = this.logicalWidth || window.innerWidth;
    const h = this.logicalHeight || window.innerHeight;
    const config = this.getEffectConfig();

    // Apply flicker effect
    const flickerMult = this.applyFlicker(config, time / 1000);
    const effectiveOpacity = Math.min(1, opacity) * flickerMult;

    // Calculate glitch offset using config
    const glitchOffset = this.calcGlitchOffset(config, w, h);

    this.textCtx.save();
    this.textCtx.textAlign = 'center';
    this.textCtx.textBaseline = 'middle';

    const fontSize = Math.max(18, h * 0.028);  // Increased from 0.02 to 0.028 (40% larger)
    this.textCtx.font = `${fontSize}px 'Courier New', monospace`;

    this.textCtx.shadowColor = config.shadowColor;
    this.textCtx.shadowBlur = fontSize * config.shadowBlur;

    // ASCII header art
    const headerLines = [
'             ╓',
'     ,▄P▀╙  ▄██▄,                              ╓█                                          ╓▌',
'   ▄██═,▄▄█▌███▀└                          ╓▄▄▀████▄∞                                    ¬████▄',
' ,███▀▀████▌ █▌                             ▀██`██                                        ▀█`',
' ████⌐ ████▌ ▐▌        ▄█,      ▄▄    ▄▄     ███ ¬▌        ▄█         ╓█▄          ▄█      ,▌        ▄█µ      ▄▄    ▄▄',
'█████⌐ ████▌ └    ▄▄▄█▀█████▄ <████▄∞████▄ ▀▀███▀▀▌  -▄▄▄█▀████⌐.▄▄▄█▀████W  ╓▄▄▄▌▀████∞ ¬▄███▄ ▄▄▄█▀█████▄ <████▄∞████▄',
'█████⌐ ████▌       ███` ╙███   ▐██▌  ▐███   ¬███  "   "███  ▀█▌  ▐███  ╙▀     ███▌  ▀▀    ▐███   ███═ "███⌐  ▐██▌  ▐███',
'█████⌐ ████▌ⁿ╙▀▄   ██`   ███   ▐██▌  ▐██▌   ¬███       ███`,█▀   ▐████▄▄▄██   ████N▄▄▄█▌  j███   ███═  ███   ▐██▌  ▐██▌',
' ████▌ █████Nw  █  ███µ  ███   ▐██▌  ▐██▌   ]███       ███▀            ▐███   "     ███▌  ▐███   ███▄  ███   ▐██▌  ▐██▌',
'  ▀███▄█▀-      █ Æ████▄;███▌ ▄████▄╓████▄ ╓█████▄▄. .▓████▄▄;,  ╓▄██▄ ▐███▄  ▄▄██▄ ████ ╓████▄ Æ████▄ç████ ╓████▄╓████▄',
'   -▀███▄    ╓▄▀    ¬▀██▀-     ╙██"  "██╙    ╙██▀       ╙▀██▀   █▀▀▀██▀`    █▀▀███▀"     `██▀    -▀██▀-     ╙██╙  \'██▀',
'      -▀▀▀▀▀▀¬                                                                   `',
    ];

    // Draw function for reuse with RGB split
    const drawConfession = (offsetX, offsetY) => {
      this.renderConfessionText(renderTarget, w, h, fontSize, offsetX, offsetY);
      // Draw header above the confession text
      this.renderHeader(headerLines, w, h, offsetX, offsetY);
    };

    // Occasional RGB channel split
    if (this.shouldApplyRGBSplit(config)) {
      // Draw red channel offset
      this.textCtx.fillStyle = `rgba(255, 0, 0, ${effectiveOpacity * 0.3})`;
      drawConfession(glitchOffset.x - config.rgbSplitOffset, glitchOffset.y);

      // Draw blue channel offset
      this.textCtx.fillStyle = `rgba(0, 0, 255, ${effectiveOpacity * 0.3})`;
      drawConfession(glitchOffset.x + config.rgbSplitOffset, glitchOffset.y);
    }

    // Draw main green channel
    this.textCtx.fillStyle = this.getTextColor(config, effectiveOpacity);
    drawConfession(glitchOffset.x, glitchOffset.y);

    // Overlay highlighting for changed characters (yellow glow on changes)
    if (stablePrev) {
      this.renderHighlightChanges(renderTarget, stablePrev, w, h, fontSize, effectiveOpacity, glitchOffset.x, glitchOffset.y);
    }

    // Show progress bar during generation
    if (showProgress) {
      const progressFontSize = h * 0.02;
      this.textCtx.font = `${progressFontSize}px 'Courier New', monospace`;
      this.textCtx.textBaseline = 'top';
      this.textCtx.fillStyle = this.getTextColor(config, 0.5 * flickerMult);

      // These must match your renderConfessionText math exactly:
      const confessionFontSize = Math.max(18, h * 0.028);
      const confessionLineHeight = confessionFontSize * 1.5;
      const totalTextHeight = TEXT_GRID.LINE_COUNT * confessionLineHeight;
      const textBottomY = (h + totalTextHeight) / 2;

      // Build ASCII progress bar
      const totalSteps = DIFFUSION_CONFIG.TOTAL_STEPS;
      const currentStep = this.frameCounter;
      const barLength = 20;
      const filledLength = Math.round((currentStep / totalSteps) * barLength);
      const emptyLength = barLength - filledLength;
      const filled = '▓'.repeat(filledLength);
      const empty = '░'.repeat(emptyLength);
      const progressText = `LOADING... |${filled}${empty}| ${currentStep}/${totalSteps}`;

      // Draw at anchored position (20px gap below the text)
      const barY = textBottomY + 20; 
      this.textCtx.fillText(progressText, w / 2 + glitchOffset.x, barY + glitchOffset.y);
    }

    this.textCtx.restore();
  }

  renderConfessionText(text, w, h, fontSize, offsetX, offsetY) {
    const paddedText = text.padEnd(TEXT_GRID.TOTAL_CHARS, ' ').substring(0, TEXT_GRID.TOTAL_CHARS);
    const lines = [];

    for (let i = 0; i < TEXT_GRID.LINE_COUNT; i++) {
      lines.push(paddedText.substring(i * TEXT_GRID.CHARS_PER_LINE, (i + 1) * TEXT_GRID.CHARS_PER_LINE));
    }

    const lineHeight = fontSize * 1.5;
    const totalHeight = TEXT_GRID.LINE_COUNT * lineHeight;
    const startY = (h - totalHeight) / 2;

    lines.forEach((line, i) => {
      const y = startY + i * lineHeight + lineHeight / 2;
      this.textCtx.fillText(line, w / 2 + offsetX, y + offsetY);
    });
  }

  renderHeader(headerLines, w, h, offsetX, offsetY) {
    const headerFontSize = 4;
    const headerLineHeight = 5;

    // Calculate confession layout (must match renderConfessionText)
    const confessionFontSize = Math.max(18, h * 0.028);
    const confessionLineHeight = confessionFontSize * 1.5;
    const confessionHeight = TEXT_GRID.LINE_COUNT * confessionLineHeight;
    const confessionStartY = (h - confessionHeight) / 2;

    const headerStartY = confessionStartY - (headerLines.length * headerLineHeight) - 30;

    this.textCtx.save();
    this.textCtx.font = `${headerFontSize}px 'Courier New', monospace`;
    this.textCtx.textAlign = 'left';
    this.textCtx.shadowBlur = headerFontSize * 0.25;

    let maxWidth = 0;
    headerLines.forEach(line => {
      const lineWidth = this.textCtx.measureText(line).width;
      if (lineWidth > maxWidth) maxWidth = lineWidth;
    });
    const blockStartX = (w - maxWidth) / 2;

    headerLines.forEach((line, i) => {
      const y = headerStartY + (i * headerLineHeight);
      this.textCtx.fillText(line, blockStartX + offsetX, y + offsetY);
    });

    this.textCtx.restore();
  }

  renderHighlightChanges(text, prevText, w, h, fontSize, opacity, offsetX, offsetY) {
    if (!prevText || !text) return;

    const paddedText = String(text).padEnd(TEXT_GRID.TOTAL_CHARS, ' ').substring(0, TEXT_GRID.TOTAL_CHARS);
    const paddedPrev = String(prevText).padEnd(TEXT_GRID.TOTAL_CHARS, ' ').substring(0, TEXT_GRID.TOTAL_CHARS);

    const lineHeight = fontSize * 1.5;
    const totalHeight = TEXT_GRID.LINE_COUNT * lineHeight;
    const startY = (h - totalHeight) / 2;
    const charWidth = fontSize * TEXT_GRID.CHAR_WIDTH_RATIO;

    this.textCtx.save();
    this.textCtx.fillStyle = `rgba(255, 255, 180, ${opacity * 0.8})`;
    this.textCtx.shadowColor = 'rgba(255, 255, 0, 0.9)';
    this.textCtx.shadowBlur = fontSize * 0.5;
    this.textCtx.textAlign = 'center';
    this.textCtx.textBaseline = 'middle';

    for (let i = 0; i < TEXT_GRID.TOTAL_CHARS; i++) {
      const char = paddedText[i];
      const prevChar = paddedPrev[i];

      if (char !== prevChar && char !== ' ') {
        const row = Math.floor(i / TEXT_GRID.CHARS_PER_LINE);
        const col = i % TEXT_GRID.CHARS_PER_LINE;
        const x = w / 2 + (col - TEXT_GRID.CENTER_OFFSET) * charWidth + offsetX;
        const y = startY + (row * lineHeight) + (lineHeight / 2) + offsetY;

        this.textCtx.fillText(char, x, y);
      }
    }
    this.textCtx.restore();
  }

  renderWebGL() {
    if (!this.webglReady) {
      this.initWebGL();
    }

    if (!this.webglReady) {
      // WebGL 2.0 failed - fall back to showing text canvas directly
      if (this.textCanvas.style.display === 'none') {
        this.textCanvas.style.display = 'block';
        this.textCanvas.style.zIndex = '10';
        this.glCanvas.style.display = 'none';
      }
      return;
    }

    const gl = this.gl;

    // Update texture from text canvas
    gl.bindTexture(gl.TEXTURE_2D, this.textTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, this.textCanvas);

    // Render to bloom framebuffer first (downsample for performance)
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.bloomFramebuffer);
    gl.viewport(0, 0, this.bloomWidth, this.bloomHeight);
    gl.clear(gl.COLOR_BUFFER_BIT);

    // Extract bright areas (phosphor green)
    gl.useProgram(this.brightPassProgram);
    gl.uniform2f(this.brightPassUniforms.uResolution, this.textCanvas.width, this.textCanvas.height);
    gl.uniform1f(this.brightPassUniforms.uTime, performance.now() / 1000.0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.textTexture);
    gl.uniform1i(this.brightPassUniforms.uTexture, 0);

    gl.bindVertexArray(this.vao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // Horizontal blur
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.blurFramebuffer1);
    gl.viewport(0, 0, this.bloomWidth, this.bloomHeight);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(this.blurProgram);
    gl.uniform2f(this.blurUniforms.uResolution, this.bloomWidth, this.bloomHeight);
    gl.uniform2f(this.blurUniforms.uDirection, 1.0, 0.0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.bloomTexture);
    gl.uniform1i(this.blurUniforms.uTexture, 0);

    gl.bindVertexArray(this.vao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // Vertical blur
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.bloomFramebuffer);
    gl.viewport(0, 0, this.bloomWidth, this.bloomHeight);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.uniform2f(this.blurUniforms.uDirection, 0.0, 1.0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.blurTexture1);
    gl.uniform1i(this.blurUniforms.uTexture, 0);

    gl.bindVertexArray(this.vao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // Final composite with all CRT effects
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.glCanvas.width, this.glCanvas.height);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(this.crtProgram);
    gl.uniform2f(this.crtUniforms.uResolution, this.glCanvas.width, this.glCanvas.height);
    gl.uniform1f(this.crtUniforms.uTime, performance.now() / 1000.0);

    // Bind text texture
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.textTexture);
    gl.uniform1i(this.crtUniforms.uTexture, 0);

    // Bind bloom texture
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, this.bloomTexture);
    gl.uniform1i(this.crtUniforms.uBloom, 1);

    gl.bindVertexArray(this.vao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  initWebGL() {
    const gl = this.gl;

    if (!gl) {
      this.webglReady = false;
      return;
    }

    try {

    // WebGL 2.0 vertex shader (GLSL ES 3.00)
    const vertexShaderSource = `#version 300 es
      in vec2 aPosition;
      out vec2 vUV;

      void main() {
        vUV = aPosition * 0.5 + 0.5;
        vUV.y = 1.0 - vUV.y;  // Flip Y-axis for Canvas texture
        gl_Position = vec4(aPosition, 0.0, 1.0);
      }
    `;

    // Bright pass shader (extract bright areas for bloom)
    const brightPassFragmentSource = `#version 300 es
      precision highp float;

      in vec2 vUV;
      out vec4 fragColor;

      uniform sampler2D uTexture;
      uniform vec2 uResolution;
      uniform float uTime;

      void main() {
        vec4 color = texture(uTexture, vUV);

        // Extract bright green channel (phosphor glow)
        float brightness = color.g;

        // Threshold for bloom
        float threshold = 0.3;
        float bloomIntensity = max(0.0, brightness - threshold) / (1.0 - threshold);

        // Keep green channel for phosphor effect
        fragColor = vec4(color.rgb * bloomIntensity * 2.0, 1.0);
      }
    `;

    // Gaussian blur shader (separable)
    const blurFragmentSource = `#version 300 es
      precision highp float;

      in vec2 vUV;
      out vec4 fragColor;

      uniform sampler2D uTexture;
      uniform vec2 uResolution;
      uniform vec2 uDirection;

      void main() {
        vec2 texelSize = 1.0 / uResolution;

        // 9-tap Gaussian blur
        vec4 color = vec4(0.0);

        color += texture(uTexture, vUV) * 0.227027;
        color += texture(uTexture, vUV + uDirection * texelSize * 1.0) * 0.1945946;
        color += texture(uTexture, vUV - uDirection * texelSize * 1.0) * 0.1945946;
        color += texture(uTexture, vUV + uDirection * texelSize * 2.0) * 0.1216216;
        color += texture(uTexture, vUV - uDirection * texelSize * 2.0) * 0.1216216;
        color += texture(uTexture, vUV + uDirection * texelSize * 3.0) * 0.054054;
        color += texture(uTexture, vUV - uDirection * texelSize * 3.0) * 0.054054;
        color += texture(uTexture, vUV + uDirection * texelSize * 4.0) * 0.016216;
        color += texture(uTexture, vUV - uDirection * texelSize * 4.0) * 0.016216;

        fragColor = color;
      }
    `;

    // CRT composite shader
    const crtFragmentSource = `#version 300 es
      precision highp float;

      in vec2 vUV;
      out vec4 fragColor;

      uniform sampler2D uTexture;
      uniform sampler2D uBloom;
      uniform vec2 uResolution;
      uniform float uTime;

      // Random noise function
      float random(vec2 st) {
        return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
      }

      // Better noise with time animation
      float animatedNoise(vec2 uv, float time) {
        vec2 noiseCoord = uv * 1.5 + vec2(time * 0.05, time * 0.03);
        return random(noiseCoord);
      }

      // Barrel distortion with aspect ratio correction
      vec2 barrelDistortion(vec2 uv, float amount) {
        vec2 cc = uv - 0.5;
        float aspectRatio = uResolution.x / uResolution.y;
        vec2 ccCorrected = cc;
        if (aspectRatio > 1.0) {
          ccCorrected.x /= aspectRatio;
        } else {
          ccCorrected.y *= aspectRatio;
        }
        float dist = dot(ccCorrected, ccCorrected);
        return uv + cc * (1.0 + dist) * dist * amount;
      }

      // RGB subpixel scanlines (authentic CRT look) - MORE VISIBLE
      vec3 applyScanlines(vec3 color, vec2 uv) {
        float scanlineCount = uResolution.y * 0.75;
        float scanlinePos = uv.y * scanlineCount;

        // Primary scanline effect - MUCH MORE PRONOUNCED
        float scanlinePattern = sin(scanlinePos * 3.14159 * 2.0);
        float scanlineMask = smoothstep(-0.3, 0.3, scanlinePattern);
        float scanlineEffect = mix(0.5, 1.0, scanlineMask);  // Darker scanlines (was 0.85)

        // RGB subpixel pattern - MORE VISIBLE
        vec3 subpixelOffsets = vec3(3.14159) * vec3(0.5, 0.5 - 2.0/3.0, 0.5 - 4.0/3.0);
        float pixelCount = uResolution.x * 0.5;  // More visible pixels
        vec3 xfactors = (2.5 + sin(uv.x * pixelCount * 3.14159 * 2.0 + subpixelOffsets)) / 3.5;

        return color * scanlineEffect * xfactors;
      }

      // Phosphor glow effect - MUCH STRONGER
      vec3 applyPhosphorGlow(vec3 color, vec3 bloom) {
        // Green phosphor tint
        vec3 phosphorColor = vec3(0.2, 1.0, 0.3);
        float grey = dot(bloom, vec3(0.21, 0.72, 0.04));
        vec3 tintedBloom = phosphorColor * grey;
        // MASSIVELY increased glow: 3x bloom + 4x tinted bloom
        return color + tintedBloom * 4.0 + bloom * 3.0;
      }

      // Horizontal sync distortion (subtle glitch)
      vec2 horizontalSync(vec2 uv, float time) {
        float syncLine = floor(uv.y * 20.0);
        float syncTime = time * 3.0 + syncLine * 0.5;
        float syncRandom = random(vec2(syncLine, floor(time * 2.0)));

        // Occasional sync glitches
        if (syncRandom > 0.97) {
          float distortion = sin(syncTime * 10.0) * 0.01;
          return vec2(uv.x + distortion, uv.y);
        }

        return uv;
      }

      // Vignette
      float vignette(vec2 uv) {
        vec2 centered = (uv - 0.5) * 2.0;
        float dist = length(centered);
        return 1.0 - smoothstep(0.5, 1.5, dist);
      }

      void main() {
        vec2 uv = vUV;

        // Pre-scale UV to compensate for barrel distortion edges
        // This ensures content fills the screen even with distortion
        float distortionAmount = 0.25;
        vec2 scaledUV = (uv - 0.5) * 0.92 + 0.5;  // Scale down to fit after distortion

        // Apply barrel distortion - MORE VISIBLE
        vec2 distortedUV = barrelDistortion(scaledUV, distortionAmount);

        // Clamp to bounds instead of hard cutoff for smoother edges
        distortedUV = clamp(distortedUV, 0.0, 1.0);

        // Apply horizontal sync distortion
        vec2 syncUV = horizontalSync(distortedUV, uTime);

        // Chromatic aberration (stronger effect)
        vec2 centered = syncUV - 0.5;
        float dist = length(centered);
        float amount = dist * 0.008;
        vec2 direction = normalize(centered);

        float r = texture(uTexture, syncUV + direction * amount).r;
        float g = texture(uTexture, syncUV).g;
        float b = texture(uTexture, syncUV - direction * amount).b;

        vec3 color = vec3(r, g, b);

        // Sample bloom (flip Y to match canvas coordinate system)
        vec2 bloomUV = vec2(distortedUV.x, 1.0 - distortedUV.y);
        vec3 bloom = texture(uBloom, bloomUV).rgb;

        // Apply phosphor glow with bloom
        color = applyPhosphorGlow(color, bloom);

        // Apply RGB subpixel scanlines
        color = applyScanlines(color, distortedUV);

        // Apply vignette
        float vig = vignette(uv);
        color *= vig;

        // MUCH STRONGER noise with less falloff for full-screen grain
        float distanceFromCenter = length(uv - 0.5);
        float noiseFalloff = 1.0 - distanceFromCenter * 0.5;  // Less falloff
        noiseFalloff = max(noiseFalloff, 0.6);  // Keep noise even at edges
        float noise = animatedNoise(uv, uTime) * 0.25 * noiseFalloff;  // 3x stronger
        color += noise - 0.125;  // Maintain centered distribution

        // Multi-frequency flicker (more organic)
        float flicker = sin(uTime * 2.3) * 0.015 +
                       sin(uTime * 5.7) * 0.008 +
                       sin(uTime * 11.3) * 0.004 +
                       sin(uTime * 23.1) * 0.002;
        color *= (1.0 + flicker);

        // Occasional brightness dips (like old monitors)
        float brightnessDip = smoothstep(0.98, 1.0, random(vec2(floor(uTime * 4.0)))) * 0.15;
        color *= (1.0 - brightnessDip);

        // Add subtle green glowing static background (like idle CRT screen)
        // Create animated static pattern
        float staticPattern = animatedNoise(uv * 3.0, uTime * 2.0);
        staticPattern = staticPattern * animatedNoise(uv * 5.0, uTime * 1.5);

        // Green phosphor background glow (very subtle, only visible on black areas)
        vec3 backgroundGlow = vec3(0.0, 0.02, 0.01) * staticPattern;

        // Mix background glow based on darkness (only show on black/dark areas)
        float darkness = 1.0 - dot(color, vec3(0.333));
        color += backgroundGlow * darkness * 0.5;

        fragColor = vec4(color, 1.0);
      }
    `;

    // Compile shaders
    const compileShader = (source, type) => {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        gl.deleteShader(shader);
        return null;
      }

      return shader;
    };

    const createProgram = (vertSource, fragSource) => {
      const vertShader = compileShader(vertSource, gl.VERTEX_SHADER);
      const fragShader = compileShader(fragSource, gl.FRAGMENT_SHADER);

      if (!vertShader || !fragShader) {
        return null;
      }

      const program = gl.createProgram();
      gl.attachShader(program, vertShader);
      gl.attachShader(program, fragShader);
      gl.linkProgram(program);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        return null;
      }

      return program;
    };

    // Create programs
    this.brightPassProgram = createProgram(vertexShaderSource, brightPassFragmentSource);
    this.blurProgram = createProgram(vertexShaderSource, blurFragmentSource);
    this.crtProgram = createProgram(vertexShaderSource, crtFragmentSource);

    if (!this.brightPassProgram || !this.blurProgram || !this.crtProgram) {
      this.webglReady = false;
      return;
    }

    // Get uniform locations
    this.brightPassUniforms = {
      uTexture: gl.getUniformLocation(this.brightPassProgram, 'uTexture'),
      uResolution: gl.getUniformLocation(this.brightPassProgram, 'uResolution'),
      uTime: gl.getUniformLocation(this.brightPassProgram, 'uTime')
    };

    this.blurUniforms = {
      uTexture: gl.getUniformLocation(this.blurProgram, 'uTexture'),
      uResolution: gl.getUniformLocation(this.blurProgram, 'uResolution'),
      uDirection: gl.getUniformLocation(this.blurProgram, 'uDirection')
    };

    this.crtUniforms = {
      uTexture: gl.getUniformLocation(this.crtProgram, 'uTexture'),
      uBloom: gl.getUniformLocation(this.crtProgram, 'uBloom'),
      uResolution: gl.getUniformLocation(this.crtProgram, 'uResolution'),
      uTime: gl.getUniformLocation(this.crtProgram, 'uTime')
    };

    // Create fullscreen quad
    const positions = new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]);

    // Create and bind VAO (WebGL 2.0)
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);

    this.positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

    const aPosition = gl.getAttribLocation(this.brightPassProgram, 'aPosition');
    gl.enableVertexAttribArray(aPosition);
    gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

    // Create text texture
    this.textTexture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.textTexture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    // Create bloom framebuffer (downsampled for performance)
    this.bloomWidth = Math.floor(this.glCanvas.width / 4);
    this.bloomHeight = Math.floor(this.glCanvas.height / 4);

    this.bloomTexture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.bloomTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, this.bloomWidth, this.bloomHeight, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    this.bloomFramebuffer = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.bloomFramebuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.bloomTexture, 0);

    // Validate framebuffer
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
      throw new Error('Failed to create bloom framebuffer');
    }

    // Create blur framebuffer
    this.blurTexture1 = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.blurTexture1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, this.bloomWidth, this.bloomHeight, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    this.blurFramebuffer1 = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.blurFramebuffer1);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.blurTexture1, 0);

    // Validate framebuffer
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
      throw new Error('Failed to create blur framebuffer');
    }

    // Unbind
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.bindTexture(gl.TEXTURE_2D, null);
    gl.bindVertexArray(null);

      this.webglReady = true;
    } catch (error) {
      this.webglReady = false;
      this.textCanvas.style.display = 'block';
      this.textCanvas.style.zIndex = '10';
      this.glCanvas.style.display = 'none';
    }
  }
}

  const app = new WEApp();
  await app.init();
});
