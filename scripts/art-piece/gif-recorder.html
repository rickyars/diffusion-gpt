, "91": "\u2013", "92": "\u2014", "93": "\u2018", "94": "\u2019", "95": "\u201c", "96": "\u201d", "97": "\u2026", "98": "\ufe0f", "99": "\ud83d\ude2d"}};

const canvas = document.getElementById('textCanvas');
const ctx = canvas.getContext('2d');

let canvasSize = 768;

// ============================================================================
// WEBGL CRT POST-PROCESSING
// ============================================================================

const webgl = {
  gl: null,
  vao: null,
  textures: {},
  framebuffers: {},
  programs: {},
  uniforms: {},
  bloomSize: { width: 0, height: 0 }
};

const VERTEX_SHADER = `#version 300 es
in vec2 aPosition;
out vec2 vUV;
void main() {
  vUV = aPosition * 0.5 + 0.5;
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

const BRIGHT_PASS_SHADER = `#version 300 es
precision highp float;
in vec2 vUV;
out vec4 fragColor;
uniform sampler2D uTexture;

void main() {
  vec2 uv = vec2(vUV.x, 1.0 - vUV.y);
  vec4 color = texture(uTexture, uv);
  float brightness = color.g;
  float threshold = 0.3;
  float intensity = max(0.0, brightness - threshold) / (1.0 - threshold);
  fragColor = vec4(color.rgb * intensity * 2.0, 1.0);
}`;

const BLUR_SHADER = `#version 300 es
precision highp float;
in vec2 vUV;
out vec4 fragColor;
uniform sampler2D uTexture;
uniform vec2 uDirection;
uniform vec2 uResolution;

void main() {
  vec2 texel = 1.0 / uResolution;
  vec4 sum = vec4(0.0);
  sum += texture(uTexture, vUV - 4.0 * uDirection * texel) * 0.016216;
  sum += texture(uTexture, vUV - 3.0 * uDirection * texel) * 0.054054;
  sum += texture(uTexture, vUV - 2.0 * uDirection * texel) * 0.121621;
  sum += texture(uTexture, vUV - 1.0 * uDirection * texel) * 0.194595;
  sum += texture(uTexture, vUV) * 0.227027;
  sum += texture(uTexture, vUV + 1.0 * uDirection * texel) * 0.194595;
  sum += texture(uTexture, vUV + 2.0 * uDirection * texel) * 0.121621;
  sum += texture(uTexture, vUV + 3.0 * uDirection * texel) * 0.054054;
  sum += texture(uTexture, vUV + 4.0 * uDirection * texel) * 0.016216;
  fragColor = sum;
}`;

const CRT_SHADER = `#version 300 es
precision highp float;
in vec2 vUV;
out vec4 fragColor;

uniform sampler2D uTexture;
uniform sampler2D uBloom;
uniform vec2 uResolution;
uniform float uTime;

float random(vec2 st) {
  return fract(sin(dot(st, vec2(12.9898, 78.233))) * 43758.5453);
}

float noise(vec2 uv, float t) {
  return random(uv * 1.5 + vec2(t * 0.05, t * 0.03));
}

vec2 barrel(vec2 uv, float amt) {
  vec2 cc = uv - 0.5;
  float aspect = uResolution.x / uResolution.y;
  vec2 adj = cc;
  if (aspect > 1.0) adj.x /= aspect;
  else adj.y *= aspect;
  float d = dot(adj, adj);
  return uv + cc * (1.0 + d) * d * amt;
}

vec3 scanlines(vec3 c, vec2 uv) {
  float count = uResolution.y * 0.75;
  float pattern = sin(uv.y * count * 6.283185);
  float mask = smoothstep(-0.3, 0.3, pattern);
  float effect = mix(0.5, 1.0, mask);

  vec3 offsets = vec3(1.571) * vec3(0.0, -0.667, -1.333);
  float px = uResolution.x * 0.5;
  vec3 rgb = (2.5 + sin(uv.x * px * 6.283185 + offsets)) / 3.5;

  return c * effect * rgb;
}

vec3 phosphorGlow(vec3 color, vec3 bloom) {
  vec3 phosphor = vec3(0.2, 1.0, 0.3);
  float luminance = dot(bloom, vec3(0.2, 0.7, 0.1));
  return color + phosphor * luminance * 4.0 + bloom * 3.0;
}

void main() {
  vec2 uv = vUV;

  vec2 scaled = (uv - 0.5) * 0.92 + 0.5;
  vec2 distorted = barrel(scaled, 0.25);
  distorted = clamp(distorted, 0.0, 1.0);

  float line = floor(distorted.y * 20.0);
  float r = random(vec2(line, floor(uTime * 5.0)));
  if (r > 0.97) {
    distorted.x += sin(uTime * 50.0 + line) * 0.005;
  }

  vec2 center = distorted - 0.5;
  float dist = length(center);
  vec2 dir = normalize(center + 0.0001);
  float amt = dist * 0.008;

  vec2 uvFlipped = vec2(distorted.x, 1.0 - distorted.y);
  vec2 dirFlipped = vec2(dir.x, -dir.y);

  float red = texture(uTexture, uvFlipped + dirFlipped * amt).r;
  float grn = texture(uTexture, uvFlipped).g;
  float blu = texture(uTexture, uvFlipped - dirFlipped * amt).b;
  vec3 color = vec3(red, grn, blu);

  vec3 bloom = texture(uBloom, distorted).rgb;
  color = phosphorGlow(color, bloom);
  color = scanlines(color, distorted);

  vec2 vc = (uv - 0.5) * 2.0;
  float vignette = 1.0 - smoothstep(0.5, 1.5, length(vc));
  color *= vignette;

  float n = noise(uv, uTime) * 0.15;
  color += n - 0.075;

  float flicker = sin(uTime * 2.3) * 0.015 +
                  sin(uTime * 5.7) * 0.008 +
                  sin(uTime * 11.3) * 0.004 +
                  sin(uTime * 23.1) * 0.002;
  color *= (1.0 + flicker);

  float dark = 1.0 - dot(color, vec3(0.333));
  float staticNoise = noise(uv * 3.0, uTime * 2.0) * noise(uv * 5.0, uTime * 1.5);
  color += vec3(0.0, 0.02, 0.01) * staticNoise * dark * 0.5;

  fragColor = vec4(color, 1.0);
}`;

function compileShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error('Shader error:', gl.getShaderInfoLog(shader));
    gl.deleteShader(shader);
    return null;
  }
  return shader;
}

function createProgram(gl, vsSource, fsSource) {
  const vs = compileShader(gl, gl.VERTEX_SHADER, vsSource);
  const fs = compileShader(gl, gl.FRAGMENT_SHADER, fsSource);
  if (!vs || !fs) return null;

  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Link error:', gl.getProgramInfoLog(program));
    return null;
  }
  return program;
}

function createTexture(gl, width, height) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return tex;
}

function createFramebuffer(gl, texture) {
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return fb;
}

function initCRT() {
  const gl = crtCanvas.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: true });
  if (!gl) {
    console.warn('WebGL2 not available');
    return false;
  }
  webgl.gl = gl;

  webgl.programs.bright = createProgram(gl, VERTEX_SHADER, BRIGHT_PASS_SHADER);
  webgl.programs.blur = createProgram(gl, VERTEX_SHADER, BLUR_SHADER);
  webgl.programs.crt = createProgram(gl, VERTEX_SHADER, CRT_SHADER);

  if (!webgl.programs.bright || !webgl.programs.blur || !webgl.programs.crt) {
    return false;
  }

  webgl.uniforms.bright = {
    uTexture: gl.getUniformLocation(webgl.programs.bright, 'uTexture')
  };
  webgl.uniforms.blur = {
    uTexture: gl.getUniformLocation(webgl.programs.blur, 'uTexture'),
    uDirection: gl.getUniformLocation(webgl.programs.blur, 'uDirection'),
    uResolution: gl.getUniformLocation(webgl.programs.blur, 'uResolution')
  };
  webgl.uniforms.crt = {
    uTexture: gl.getUniformLocation(webgl.programs.crt, 'uTexture'),
    uBloom: gl.getUniformLocation(webgl.programs.crt, 'uBloom'),
    uResolution: gl.getUniformLocation(webgl.programs.crt, 'uResolution'),
    uTime: gl.getUniformLocation(webgl.programs.crt, 'uTime')
  };

  const verts = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);

  webgl.vao = gl.createVertexArray();
  gl.bindVertexArray(webgl.vao);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  webgl.textures.source = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, webgl.textures.source);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  return true;
}

function setupBloomBuffers() {
  const gl = webgl.gl;
  if (!gl) return;

  const w = Math.floor(canvasSize / 4);
  const h = Math.floor(canvasSize / 4);

  if (w === webgl.bloomSize.width && h === webgl.bloomSize.height) return;
  webgl.bloomSize = { width: w, height: h };

  if (webgl.textures.bloom) gl.deleteTexture(webgl.textures.bloom);
  if (webgl.textures.blur) gl.deleteTexture(webgl.textures.blur);
  if (webgl.framebuffers.bloom) gl.deleteFramebuffer(webgl.framebuffers.bloom);
  if (webgl.framebuffers.blur) gl.deleteFramebuffer(webgl.framebuffers.blur);

  webgl.textures.bloom = createTexture(gl, w, h);
  webgl.textures.blur = createTexture(gl, w, h);
  webgl.framebuffers.bloom = createFramebuffer(gl, webgl.textures.bloom);
  webgl.framebuffers.blur = createFramebuffer(gl, webgl.textures.blur);
}

function renderCRT(time) {
  const gl = webgl.gl;
  if (!gl) return;

  const w = canvasSize;
  const h = canvasSize;
  const bw = webgl.bloomSize.width;
  const bh = webgl.bloomSize.height;

  gl.bindVertexArray(webgl.vao);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, webgl.textures.source);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);

  gl.bindFramebuffer(gl.FRAMEBUFFER, webgl.framebuffers.bloom);
  gl.viewport(0, 0, bw, bh);
  gl.useProgram(webgl.programs.bright);
  gl.uniform1i(webgl.uniforms.bright.uTexture, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  gl.bindFramebuffer(gl.FRAMEBUFFER, webgl.framebuffers.blur);
  gl.useProgram(webgl.programs.blur);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, webgl.textures.bloom);
  gl.uniform1i(webgl.uniforms.blur.uTexture, 0);
  gl.uniform2f(webgl.uniforms.blur.uDirection, 1.0, 0.0);
  gl.uniform2f(webgl.uniforms.blur.uResolution, bw, bh);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  gl.bindFramebuffer(gl.FRAMEBUFFER, webgl.framebuffers.bloom);
  gl.bindTexture(gl.TEXTURE_2D, webgl.textures.blur);
  gl.uniform2f(webgl.uniforms.blur.uDirection, 0.0, 1.0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, w, h);
  gl.useProgram(webgl.programs.crt);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, webgl.textures.source);
  gl.uniform1i(webgl.uniforms.crt.uTexture, 0);

  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, webgl.textures.bloom);
  gl.uniform1i(webgl.uniforms.crt.uBloom, 1);

  gl.uniform2f(webgl.uniforms.crt.uResolution, w, h);
  gl.uniform1f(webgl.uniforms.crt.uTime, time);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ============================================================================
// 2D CANVAS EFFECTS
// ============================================================================

function calcFlicker(time) {
  const speed = CONFIG.effects.flickerSpeed;
  const intensity = CONFIG.effects.flickerIntensity;

  let flicker = Math.sin(time * speed) * 0.4 +
                Math.sin(time * speed * 1.7) * 0.3 +
                Math.sin(time * speed * 3.1) * 0.2 +
                Math.sin(time * speed * 7.3) * 0.1;

  flicker = (flicker + 1.0) * 0.5;
  flicker = 1.0 - (intensity * (1.0 - flicker));

  if (Math.random() < 0.01) {
    flicker *= 0.85 + Math.random() * 0.1;
  }

  return flicker;
}

function calcGlitchOffset(w, h) {
  const intensity = CONFIG.effects.glitchIntensity;
  return {
    x: (Math.random() - 0.5) * intensity * w,
    y: (Math.random() - 0.5) * intensity * h
  };
}

function shouldRGBSplit() {
  return Math.random() < CONFIG.effects.rgbSplitChance;
}

  '█████⌐ ████▌ⁿ╙▀▄   ██`   ███   ▐██▌  ▐██▌   ¬███       ███`,█▀   ▐████▄▄▄██   ████N▄▄▄█▌  j███   ███═  ███   ▐██▌  ▐██▌',
  ' ████▌ █████Nw  █  ███µ  ███   ▐██▌  ▐██▌   ]███       ███▀            ▐███   "     ███▌  ▐███   ███▄  ███   ▐██▌  ▐██▌',
  '  ▀███▄█▀-      █ Æ████▄;███▌ ▄████▄╓████▄ ╓█████▄▄. .▓████▄▄;,  ╓▄██▄ ▐███▄  ▄▄██▄ ████ ╓████▄ Æ████▄ç████ ╓████▄╓████▄',
  '   -▀███▄    ╓▄▀    ¬▀██▀-     ╙██"  "██╙    ╙██▀       ╙▀██▀   █▀▀▀██▀`    █▀▀███▀"     `██▀    -▀██▀-     ╙██╙  \'██▀',
  '      -▀▀▀▀▀▀¬                                                                   `',
];

function renderConfession(text, step, totalSteps, prevText = '', opacity = 1.0, time) {
  const w = canvasSize;
  const h = canvasSize;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);

  const flicker = calcFlicker(time);
  const offset = calcGlitchOffset(w, h);
  const doRGBSplit = shouldRGBSplit();
  const effectiveOpacity = opacity * flicker;

  const fontSize = Math.max(16, h * 0.042);
  ctx.fillStyle = `rgba(51, 255, 51, ${effectiveOpacity})`;
  ctx.shadowColor = `rgba(51, 255, 51, ${effectiveOpacity})`;
  ctx.shadowBlur = fontSize * 0.25;

  const lineHeight = fontSize * 1.5;
  const totalTextHeight = TEXT_GRID.rows * lineHeight;
  const textStartY = (h - totalTextHeight) / 2;
  const charWidth = fontSize * 0.6;

  function drawAllContent(ox, oy) {
    const headerFontSize = 4;
    const headerLineHeight = 5;
    ctx.font = `${headerFontSize}px 'Courier New', monospace`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.shadowBlur = headerFontSize * 0.25;

    let maxHeaderWidth = 0;
    for (const line of HEADER_LINES) {
      const width = ctx.measureText(line).width;
      if (width > maxHeaderWidth) maxHeaderWidth = width;
    }
    const headerStartX = (w - maxHeaderWidth) / 2;
    const headerStartY = textStartY - (HEADER_LINES.length * headerLineHeight) - 30;

    for (let i = 0; i < HEADER_LINES.length; i++) {
      ctx.fillText(HEADER_LINES[i], headerStartX + ox, headerStartY + i * headerLineHeight + oy);
    }

    ctx.font = `${fontSize}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowBlur = fontSize * 0.25;

    const paddedText = text.padEnd(TEXT_GRID.total, ' ').substring(0, TEXT_GRID.total);
    for (let row = 0; row < TEXT_GRID.rows; row++) {
      const line = paddedText.substring(row * TEXT_GRID.cols, (row + 1) * TEXT_GRID.cols);
      const y = textStartY + row * lineHeight + lineHeight / 2;
      ctx.fillText(line, w / 2 + ox, y + oy);
    }
  }

  if (doRGBSplit) {
    const rgbOffset = CONFIG.effects.rgbSplitOffset;
    ctx.shadowColor = 'transparent';

    ctx.fillStyle = `rgba(255, 0, 0, ${effectiveOpacity * 0.3})`;
    drawAllContent(offset.x - rgbOffset, offset.y);

    ctx.fillStyle = `rgba(0, 0, 255, ${effectiveOpacity * 0.3})`;
    drawAllContent(offset.x + rgbOffset, offset.y);

    ctx.fillStyle = `rgba(51, 255, 51, ${effectiveOpacity})`;
    ctx.shadowColor = `rgba(51, 255, 51, ${effectiveOpacity})`;
  }

  drawAllContent(offset.x, offset.y);

  const paddedText = text.padEnd(TEXT_GRID.total, ' ').substring(0, TEXT_GRID.total);
  if (prevText && step < totalSteps) {
    const paddedPrev = prevText.padEnd(TEXT_GRID.total, ' ').substring(0, TEXT_GRID.total);
    ctx.fillStyle = `rgba(255, 255, 180, ${effectiveOpacity * 0.8})`;
    ctx.shadowColor = `rgba(255, 255, 0, ${effectiveOpacity * 0.9})`;
    ctx.shadowBlur = fontSize * 0.5;
    ctx.font = `${fontSize}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let i = 0; i < TEXT_GRID.total; i++) {
      const char = paddedText[i];
      const prevChar = paddedPrev[i];
      if (char !== prevChar && char !== ' ') {
        const row = Math.floor(i / TEXT_GRID.cols);
        const col = i % TEXT_GRID.cols;
        const centerOffset = (TEXT_GRID.cols - 1) / 2;
        const x = w / 2 + (col - centerOffset) * charWidth + offset.x;
        const y = textStartY + row * lineHeight + lineHeight / 2 + offset.y;
        ctx.fillText(char, x, y);
      }
    }
  }

  if (step < totalSteps) {
    const barFontSize = Math.max(12, h * 0.02);
    ctx.font = `${barFontSize}px 'Courier New', monospace`;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(51, 255, 51, ${effectiveOpacity * 0.5})`;
    ctx.shadowColor = `rgba(51, 255, 51, ${effectiveOpacity * 0.5})`;
    ctx.shadowBlur = barFontSize * 0.25;

    const barLength = 20;
    const filled = Math.round((step / totalSteps) * barLength);
    const empty = barLength - filled;
    const barText = `LOADING... |${'▓'.repeat(filled)}${'░'.repeat(empty)}| ${step}/${totalSteps}`;

    const barY = textStartY + totalTextHeight + 20;
    ctx.fillText(barText, w / 2 + offset.x, barY + offset.y);
  }
}

// ============================================================================
// DIFFUSION STATE
// ============================================================================

const diffState = {
  tokens: new Int32Array(MODEL.blockSize),
  tokensBigInt: new BigInt64Array(MODEL.blockSize),
  sigmaData: new Float32Array(1),
  probBuffer: new Float64Array(MODEL.vocabSize)
};

function resetTokens() {
  for (let i = 0; i < MODEL.blockSize; i++) {
    diffState.tokens[i] = Math.floor(Math.random() * MODEL.vocabSize);
  }
}

// ============================================================================
// SIGMA SCHEDULE
// ============================================================================

const logSigmaMin = Math.log(CONFIG.sigmaMin);
const logSigmaMax = Math.log(CONFIG.sigmaMax);

function getSigma(t) {
  return Math.exp((1 - t) * logSigmaMin + t * logSigmaMax);
}

// ============================================================================
// DECODE
// ============================================================================

function decode() {
  let result = '';
  for (let i = 0; i < diffState.tokens.length; i++) {
    result += VOCAB.itos[diffState.tokens[i]] || '?';
  }
  return result;
}

// ============================================================================
// DISCRETE DIFFUSION SAMPLING
// ============================================================================

function sampleTokens(logits, deltaSigma) {
  const vocabSize = MODEL.vocabSize;
  const seqLen = MODEL.blockSize;
  const probBuffer = diffState.probBuffer;

  const expNegDelta = Math.exp(-deltaSigma);
  const invExpNegDelta = 1.0 / expNegDelta;
  const transitionBase = (1 - expNegDelta) / vocabSize;
  const transitionDiag = 1 - (vocabSize - 1) * transitionBase;
  const correctionFactor = (expNegDelta - 1) / (vocabSize * expNegDelta);

  for (let pos = 0; pos < seqLen; pos++) {
    const offset = pos * vocabSize;
    const currentToken = diffState.tokens[pos];

    let maxLogit = -Infinity;
    for (let v = 0; v < vocabSize; v++) {
      if (logits[offset + v] > maxLogit) maxLogit = logits[offset + v];
    }

    let expSum = 0;
    for (let v = 0; v < vocabSize; v++) {
      expSum += Math.exp(logits[offset + v] - maxLogit);
    }

    const correction = correctionFactor * expSum;
    let probSum = 0;

    for (let v = 0; v < vocabSize; v++) {
      const expLogit = Math.exp(logits[offset + v] - maxLogit);
      const score = correction + expLogit * invExpNegDelta;
      const transProb = (v === currentToken) ? transitionDiag : transitionBase;
      const prob = Math.max(0, score * transProb);
      probBuffer[v] = prob;
      probSum += prob;
    }

    const rand = Math.random() * probSum;
    let cumsum = 0;
    let sampled = currentToken;

    for (let v = 0; v < vocabSize; v++) {
      cumsum += probBuffer[v];
      if (rand <= cumsum) {
        sampled = v;
        break;
      }
    }

    diffState.tokens[pos] = sampled;
  }
}

// ============================================================================
// MODEL INFERENCE
// ============================================================================

async function runInference(session, sigma) {
  for (let i = 0; i < MODEL.blockSize; i++) {
    diffState.tokensBigInt[i] = BigInt(diffState.tokens[i]);
  }

  diffState.sigmaData[0] = sigma;

  const inputTensor = new ort.Tensor('int64', diffState.tokensBigInt, [1, MODEL.blockSize]);
  const sigmaTensor = new ort.Tensor('float32', diffState.sigmaData, [1, 1]);

  const results = await session.run({
    'input_ids': inputTensor,
    'sigma': sigmaTensor
  });

  const logits = await results.logits.getData();

  for (const key in results) {
    if (results[key]?.dispose) results[key].dispose();
  }
  inputTensor.dispose();
  sigmaTensor.dispose();

  return logits;
}

// ============================================================================
// RECORDING
// ============================================================================

let session = null;
let gifBlob = null;

// Capture frame from WebGL CRT canvas
function captureFrame() {
  const gl = webgl.gl;
  const pixels = new Uint8Array(canvasSize * canvasSize * 4);
  gl.readPixels(0, 0, canvasSize, canvasSize, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

  // WebGL reads bottom-to-top, need to flip vertically
  const flipped = new Uint8ClampedArray(canvasSize * canvasSize * 4);
  const rowSize = canvasSize * 4;
  for (let y = 0; y < canvasSize; y++) {
    const srcRow = (canvasSize - 1 - y) * rowSize;
    const dstRow = y * rowSize;
    flipped.set(pixels.subarray(srcRow, srcRow + rowSize), dstRow);
  }

  return new ImageData(flipped, canvasSize, canvasSize);
}

async function loadModel() {
  const wasmOptions = {
    executionProviders: ['wasm'],
    executionMode: 'sequential',
    graphOptimizationLevel: 'basic'
  };

  try {
    const webgpuOptions = {
      executionProviders: [{ name: 'webgpu', preferredOutputLocation: 'cpu' }],
      graphOptimizationLevel: 'all'
    };
    session = await ort.InferenceSession.create(CONFIG.modelUrl, webgpuOptions);
    statusEl.textContent = 'Model loaded (WebGPU). Ready to record.';
  } catch (e) {
    session = await ort.InferenceSession.create(CONFIG.modelUrl, wasmOptions);
    statusEl.textContent = 'Model loaded (WASM). Ready to record.';
  }

  recordBtn.disabled = false;
}

async function record() {
  recordBtn.disabled = true;
  downloadBtn.disabled = true;
  gifBlob = null;

  const fps = parseInt(fpsInput.value);
  const holdMs = parseInt(holdInput.value);
  const fadeMs = parseInt(fadeInput.value);
  const frameInterval = 1000 / fps;
  const stepDelayMs = CONFIG.stepDelayMs; // 100ms per diffusion step

  const encoder = GIFEncoder();
  const frames = [];

  resetTokens();
  let previousText = '';
  let simTime = 0;

  statusEl.textContent = 'GENERATING...';

  // Generation phase
  const steps = CONFIG.steps;
  const eps = 1e-5;
  const stepSize = (1 - eps) / steps;

  // How many GIF frames to capture per diffusion step (during the 100ms delay)
  const framesPerStep = Math.max(1, Math.round(stepDelayMs / frameInterval));

  for (let i = 0; i < steps; i++) {
    const t = 1 - (i + 1) * stepSize;
    const sigma = getSigma(t);

    const deltaSigma = (i < steps - 1)
      ? sigma - getSigma(t - stepSize)
      : sigma;

    const logits = await runInference(session, sigma);
    sampleTokens(logits, deltaSigma);

    const currentText = decode();

    // Capture multiple frames during this step's delay period
    // This allows CRT effects to animate while text stays the same
    for (let f = 0; f < framesPerStep; f++) {
      renderConfession(currentText, i + 1, steps, previousText, 1.0, simTime);
      renderCRT(simTime);
      frames.push(captureFrame());
      simTime += frameInterval / 1000;
    }

    previousText = currentText;
    statusEl.textContent = `GENERATING... step ${i + 1}/${steps}`;
  }

  const finalText = decode();

  // Hold phase - CRT effects continue animating
  const holdFrames = Math.ceil(holdMs / frameInterval);
  statusEl.textContent = 'HOLDING...';
  for (let i = 0; i < holdFrames; i++) {
    renderConfession(finalText, steps, steps, '', 1.0, simTime);
    renderCRT(simTime);
    frames.push(captureFrame());
    simTime += frameInterval / 1000;
  }

  // Fade phase - CRT effects continue animating
  const fadeFrames = Math.ceil(fadeMs / frameInterval);
  statusEl.textContent = 'FADING...';
  for (let i = 0; i < fadeFrames; i++) {
    const opacity = 1 - (i / fadeFrames);
    renderConfession(finalText, steps, steps, '', opacity, simTime);
    renderCRT(simTime);
    frames.push(captureFrame());
    simTime += frameInterval / 1000;
  }

  // Encode GIF
  statusEl.textContent = `Encoding ${frames.length} frames...`;

  const delay = Math.round(1000 / fps);

  for (let i = 0; i < frames.length; i++) {
    const { data, width, height } = frames[i];
    const palette = quantize(data, 256);
    const index = applyPalette(data, palette);
    encoder.writeFrame(index, width, height, { palette, delay });

    if (i % 10 === 0) {
      statusEl.textContent = `Encoding frame ${i + 1}/${frames.length}...`;
      await new Promise(r => setTimeout(r, 0));
    }
  }

  encoder.finish();
  const output = encoder.bytes();
  gifBlob = new Blob([output], { type: 'image/gif' });

  const sizeMB = (gifBlob.size / (1024 * 1024)).toFixed(2);
  statusEl.textContent = `Done! GIF size: ${sizeMB} MB (${frames.length} frames)`;

  recordBtn.disabled = false;
  downloadBtn.disabled = false;
}

function download() {
  if (!gifBlob) return;
  const url = URL.createObjectURL(gifBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `we-confession-${Date.now()}.gif`;
  a.click();
  URL.revokeObjectURL(url);
}

recordBtn.addEventListener('click', record);
downloadBtn.addEventListener('click', download);

// ============================================================================
// INIT
// ============================================================================

const script = document.createElement('script');
script.src = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/ort.min.js';
script.onload = () => {
  initCRT();
  resizeCanvas(768);
  loadModel();
};
document.head.appendChild(script);
  </script>
